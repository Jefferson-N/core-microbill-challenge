<div class="provider-container">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Proveedores</h2>
    <p-button label="Nuevo Proveedor" icon="pi pi-plus" (onClick)="openNew()"></p-button>
  </div>

  <!-- Table -->
  <p-table [value]="providers" [tableStyle]="{'min-width': '50rem'}">
    <ng-template pTemplate="header">
      <tr>
        <th>RUC/NIF</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Dirección</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-provider>
      <tr>
        <td>{{ provider.taxId }}</td>
        <td>{{ provider.name }}</td>
        <td>{{ provider.email }}</td>
        <td>{{ provider.address }}</td>
        <td>
          <p-button icon="pi pi-pencil" class="p-button-rounded p-button-warning mr-2" 
            (onClick)="editProvider(provider)" size="small"></p-button>
          <p-button icon="pi pi-trash" class="p-button-rounded p-button-danger" 
            (onClick)="deleteProvider(provider)" size="small"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Pagination -->
  <p-paginator 
    [rows]="rows" 
    [totalRecords]="totalRecords" 
    [first]="first"
    (onPageChange)="onPageChange($event)">
  </p-paginator>

  <!-- Dialog -->
  <p-dialog header="{{ provider.id ? 'Editar Proveedor' : 'Nuevo Proveedor' }}" 
    [(visible)]="providerDialog" [modal]="true" [style]="{width: '450px'}">
    <form class="p-fluid">
      <div class="field">
        <label for="name">Nombre *</label>
        <input id="name" type="text" pInputText [(ngModel)]="provider.name" 
          name="name" required [class.ng-invalid]="submitted && !provider.name">
        <small class="p-error" *ngIf="submitted && !provider.name">El nombre es requerido.</small>
      </div>
      
      <div class="field">
        <label for="taxId">RUC/NIF *</label>
        <input id="taxId" type="text" pInputText [(ngModel)]="provider.taxId" 
          name="taxId" required [class.ng-invalid]="submitted && !provider.taxId">
        <small class="p-error" *ngIf="submitted && !provider.taxId">El RUC/NIF es requerido.</small>
      </div>
      
      <div class="field">
        <label for="email">Email *</label>
        <input id="email" type="email" pInputText [(ngModel)]="provider.email" 
          name="email" required [class.ng-invalid]="submitted && !provider.email">
        <small class="p-error" *ngIf="submitted && !provider.email">El email es requerido.</small>
      </div>
      
      <div class="field">
        <label for="address">Dirección</label>
        <input id="address" type="text" pInputText [(ngModel)]="provider.address" name="address">
      </div>
    </form>
    
    <ng-template pTemplate="footer">
      <p-button label="Cancelar" icon="pi pi-times" class="p-button-text" (onClick)="hideDialog()"></p-button>
      <p-button label="Guardar" icon="pi pi-check" (onClick)="saveProvider()"></p-button>
    </ng-template>
  </p-dialog>

  <p-confirmDialog></p-confirmDialog>
  <p-toast></p-toast>
</div>
