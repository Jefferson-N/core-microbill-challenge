<div class="login-container">
  <h2><i class="pi pi-lock"></i> Login</h2>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="p-field">
      <label for="username"><i class="pi pi-user"></i> Username</label>
      <input id="username" type="text" pInputText [(ngModel)]="username" name="username" required />
    </div>

    <div class="p-field">
      <label for="password"><i class="pi pi-key"></i> Password</label>
      <p-password [(ngModel)]="password" name="password" placeholder="Ingrese su contraseña" required>
      </p-password>
    </div>

    <button pButton type="submit" label="Login" icon="pi pi-sign-in" [disabled]="!loginForm.valid"></button>

    <button pButton type="button" label="Usuarios Demo" icon="pi pi-info-circle" class="p-button-help p-ml-2"
            (click)="registerDialogVisible = true"></button>
  </form>
</div>

<!-- Modal de usuarios demo -->
<p-dialog header="Usuarios Demo" [(visible)]="registerDialogVisible" [modal]="true" [closable]="true" [style]="{width: '500px'}">
  <div class="demo-users">
    <h4><i class="pi pi-users"></i> Credenciales de Prueba</h4>
    
    <div class="user-card">
      <h5><i class="pi pi-user-edit"></i> Administrador</h5>
      <p><strong>Usuario:</strong> admin@demo.com</p>
      <p><strong>Contraseña:</strong> Admin#123</p>
      <p><strong>Roles:</strong> ADMIN, USER</p>
    </div>
    
    <div class="user-card">
      <h5><i class="pi pi-user"></i> Usuario Regular</h5>
      <p><strong>Usuario:</strong> user@demo.com</p>
      <p><strong>Contraseña:</strong> User#123</p>
      <p><strong>Roles:</strong> USER</p>
    </div>
    
    <div class="info-note">
      <i class="pi pi-info-circle"></i>
      <span>Copie y pegue las credenciales en el formulario de login</span>
    </div>
  </div>
  
  <div class="dialog-footer">
    <button pButton type="button" label="Cerrar" icon="pi pi-times" 
            (click)="registerDialogVisible = false"></button>
  </div>
</p-dialog>
