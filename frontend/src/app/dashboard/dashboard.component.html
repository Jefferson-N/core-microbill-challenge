<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Menu</h2>
    <nav>
      <a routerLink="/customers" routerLinkActive="active">Customers</a>
      <a routerLink="/providers" routerLinkActive="active">Providers</a>
      <a routerLink="/products" routerLinkActive="active">Products</a>
      <a routerLink="/invoices" routerLinkActive="active">Invoices</a>
      <a routerLink="/invoice-form" routerLinkActive="active">New Invoice</a>
      <a routerLink="/reports" routerLinkActive="active">Reports</a>
    </nav>
  </aside>

  <div class="main">
    <header class="header">
      <button class="menu-btn" (click)="toggleSidebar()">☰</button>
      <h1>Dashboard</h1>
      
      <!-- API Documentation Dropdown -->
      <div class="api-docs-dropdown">
        <p-button 
          label="API Docs" 
          icon="pi pi-book" 
          [text]="true"
          (onClick)="menu.toggle($event)"
          aria-haspopup="true" 
          aria-controls="api_menu">
        </p-button>
        <p-menu #menu [model]="apiMenuItems" [popup]="true"></p-menu>
      </div>
      
      <button class="logout-btn" (click)="logout()">Logout</button>
    </header>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </div>
</div>
