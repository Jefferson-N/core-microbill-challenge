<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Menú</h2>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/customers" routerLinkActive="active">Clientes</a>
      <a routerLink="/providers" routerLinkActive="active">Proveedores</a>
      <a routerLink="/products" routerLinkActive="active">Productos</a>
      <a routerLink="/invoices" routerLinkActive="active">Facturas</a>
      <a routerLink="/invoice-form" routerLinkActive="active">Nueva Factura</a>
      <a routerLink="/reports" routerLinkActive="active">Reportes</a>
    </nav>
  </aside>

  <div class="main">
    <header class="header">
      <button class="menu-btn" (click)="toggleSidebar()">☰</button>
      <h1>Dashboard</h1>
      
      <!-- API Documentation Dropdown -->
      <div class="api-docs-dropdown">
        <p-button 
          label="API Docs" 
          icon="pi pi-book" 
          [text]="true"
          (onClick)="menu.toggle($event)"
          aria-haspopup="true" 
          aria-controls="api_menu">
        </p-button>
        <p-menu #menu [model]="apiMenuItems" [popup]="true"></p-menu>
      </div>
      
      <button class="logout-btn" (click)="logout()">Salir</button>
    </header>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </div>
</div>
