<div class="product-container">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Productos</h2>
    <p-button label="Nuevo Producto" icon="pi pi-plus" (onClick)="openNew()"></p-button>
  </div>

  <!-- Table -->
  <p-table [value]="products" [tableStyle]="{'min-width': '50rem'}">
    <ng-template pTemplate="header">
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>IVA</th>
        <th>Stock</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>{{ product.code }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price | currency }}</td>
        <td>{{ (product.taxRate * 100) | number:'1.0-2' }}%</td>
        <td>{{ product.stock }}</td>
        <td>
          <p-button icon="pi pi-pencil" class="p-button-rounded p-button-warning mr-2" 
            (onClick)="editProduct(product)" size="small"></p-button>
          <p-button icon="pi pi-trash" class="p-button-rounded p-button-danger" 
            (onClick)="deleteProduct(product)" size="small"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Pagination -->
  <p-paginator 
    [rows]="rows" 
    [totalRecords]="totalRecords" 
    [first]="first"
    (onPageChange)="onPageChange($event)">
  </p-paginator>

  <!-- Dialog -->
  <p-dialog header="{{ product.id ? 'Editar Producto' : 'Nuevo Producto' }}" 
    [(visible)]="productDialog" [modal]="true" [style]="{width: '450px'}">
    <form class="p-fluid">
      <div class="field">
        <label for="code">Código *</label>
        <input id="code" type="text" pInputText [(ngModel)]="product.code" 
          name="code" required [class.ng-invalid]="submitted && !product.code">
        <small class="p-error" *ngIf="submitted && !product.code">El código es requerido.</small>
      </div>
      
      <div class="field">
        <label for="name">Nombre *</label>
        <input id="name" type="text" pInputText [(ngModel)]="product.name" 
          name="name" required [class.ng-invalid]="submitted && !product.name">
        <small class="p-error" *ngIf="submitted && !product.name">El nombre es requerido.</small>
      </div>
      
      <div class="field">
        <label for="price">Precio *</label>
        <p-inputNumber id="price" [(ngModel)]="product.price" name="price"
          mode="currency" currency="USD" [minFractionDigits]="2"
          [class.ng-invalid]="submitted && product.price < 0">
        </p-inputNumber>
        <small class="p-error" *ngIf="submitted && product.price < 0">El precio debe ser mayor a 0.</small>
      </div>
      
      <div class="field">
        <label for="taxRate">IVA (%)</label>
        <p-inputNumber id="taxRate" [(ngModel)]="product.taxRate" name="taxRate"
          [min]="0" [max]="1" [step]="0.01" suffix="%" 
          [showButtons]="true" buttonLayout="horizontal">
        </p-inputNumber>
      </div>
      
      <div class="field">
        <label for="stock">Stock</label>
        <p-inputNumber id="stock" [(ngModel)]="product.stock" name="stock"
          [min]="0" [showButtons]="true">
        </p-inputNumber>
      </div>
    </form>
    
    <ng-template pTemplate="footer">
      <p-button label="Cancelar" icon="pi pi-times" class="p-button-text" (onClick)="hideDialog()"></p-button>
      <p-button label="Guardar" icon="pi pi-check" (onClick)="saveProduct()"></p-button>
    </ng-template>
  </p-dialog>

  <p-confirmDialog></p-confirmDialog>
  <p-toast></p-toast>
</div>
