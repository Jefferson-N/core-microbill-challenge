version: "3.8"

services:
  mysql:
    image: mysql:9.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-microservices_db}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASS:-admin123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ${MYSQL_VOLUME:-mysql-data}:/var/lib/mysql
      - ./database/container-script/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/app/data/init-databases.sql:/docker-entrypoint-initdb.d/02-data.sql
      # - ./database/app/schema/init-auth.sql:/docker-entrypoint-initdb.d/03-schema.sql
      # - ./database/app/data/init-billing.sql:/docker-entrypoint-initdb.d/04-data.sql
    networks:
      - microbill-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: microbill-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microbill-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./microbill-authentication-service
      dockerfile: Dockerfile
    container_name: microbill-auth-service
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_PORT_AUTH: ${DB_PORT_AUTH:-3306}
      DB_NAME_AUTH: ${DB_NAME:-microservices_db}
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microbill-network
    restart: unless-stopped

  management-service:
    build:
      context: ./microbill-management-service
      dockerfile: Dockerfile
    container_name: microbill-management-service
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_PORT_MANAGEMENT: ${DB_PORT:-3306}
      DB_NAME_MANAGEMENT: ${DB_NAME:-microbill}
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "${MANAGEMENT_SERVICE_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microbill-network
    restart: unless-stopped

  billing-service:
    build:
      context: ./microbill-billing-service
      dockerfile: Dockerfile
    container_name: microbill-billing-service
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_PORT_BILLING: ${DB_PORT:-3306}
      DB_NAME_BILLING: ${DB_NAME:-microbill}
      RABBITMQ_HOST: rabbitmq
      AI_SERVICE_URL: http://ai-service:8084
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "${BILLING_SERVICE_PORT:-8083}:8083"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microbill-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./microbill-billing-ia
      dockerfile: Dockerfile
    container_name: microbill-ai-service
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-microbill}
    ports:
      - "${AI_SERVICE_PORT:-8084}:8084"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microbill-network
    restart: unless-stopped

volumes:
  mysql_db_data:
  rabbitmq-data:

networks:
  microbill-network:
    driver: bridge
