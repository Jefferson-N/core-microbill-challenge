version: '3.8'

services:
  # MySQL Database for Auth Service
  mysql-auth:
    image: mysql:8.0
    container_name: microbill-mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME_AUTH}
    ports:
      - "${DB_PORT_AUTH}:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks:
      - microbill-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Database for Management Service
  mysql-management:
    image: mysql:8.0
    container_name: microbill-mysql-management
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME_MANAGEMENT}
    ports:
      - "${DB_PORT_MANAGEMENT}:3306"
    volumes:
      - mysql-management-data:/var/lib/mysql
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microbill-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Database for Billing Service
  mysql-billing:
    image: mysql:8.0
    container_name: microbill-mysql-billing
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME_BILLING}
    ports:
      - "${DB_PORT_BILLING}:3306"
    volumes:
      - mysql-billing-data:/var/lib/mysql
    networks:
      - microbill-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: microbill-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microbill-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Authentication Service
  auth-service:
    build:
      context: ./microbill-authentication-service
      dockerfile: Dockerfile
    container_name: microbill-auth-service
    env_file:
      - .env
    environment:
      DB_HOST: mysql-auth
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    depends_on:
      mysql-auth:
        condition: service_healthy
    networks:
      - microbill-network
    restart: unless-stopped

  # Management Service
  management-service:
    build:
      context: ./microbill-management-service
      dockerfile: Dockerfile
    container_name: microbill-management-service
    env_file:
      - .env
    environment:
      DB_HOST: mysql-management
    ports:
      - "${MANAGEMENT_SERVICE_PORT}:8082"
    depends_on:
      mysql-management:
        condition: service_healthy
    networks:
      - microbill-network
    restart: unless-stopped

  # Billing Service
  billing-service:
    build:
      context: ./microbill-billing-service
      dockerfile: Dockerfile
    container_name: microbill-billing-service
    env_file:
      - .env
    environment:
      DB_HOST: mysql-billing
      RABBITMQ_HOST: rabbitmq
      AI_SERVICE_URL: http://ai-service:8084
    ports:
      - "${BILLING_SERVICE_PORT}:8083"
    depends_on:
      mysql-billing:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microbill-network
    restart: unless-stopped

  # AI Service (Python)
  ai-service:
    build:
      context: ./microbill-billing-ia
      dockerfile: Dockerfile
    container_name: microbill-ai-service
    ports:
      - "8084:8084"
    networks:
      - microbill-network
    restart: unless-stopped

volumes:
  mysql-auth-data:
  mysql-management-data:
  mysql-billing-data:
  rabbitmq-data:

networks:
  microbill-network:
    driver: bridge
