# Application
spring.application.name=microbill-billing-service

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# Security Configuration
security.public-endpoints=${SECURITY_PUBLIC_ENDPOINTS:/swagger-ui/**,/api-docs/**,/actuator/**,/api/health,/internal/**}

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:microbill_billing}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:appuser123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

# Server
server.port=${BILLING_SERVICE_PORT:8083}

# Service URLs
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
ai.service.url=${AI_SERVICE_URL:http://ai-service:8084}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.core.microbill=${LOGGING_LEVEL_COM_CORE_MICROBILL:DEBUG}

# RabbitMQ Config
rabbitmq.exchange.invoice=${RABBITMQ_EXCHANGE_INVOICE:invoice.exchange}
rabbitmq.queue.invoice-created=${RABBITMQ_QUEUE_INVOICE_CREATED:invoice.created.queue}
rabbitmq.routing-key.invoice-created=${RABBITMQ_ROUTING_KEY_INVOICE_CREATED:invoice.created}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
