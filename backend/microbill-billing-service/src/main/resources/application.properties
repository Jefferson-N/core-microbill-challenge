# Application
spring.application.name=microbill-billing-service

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:microbill_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:microbill_user}
spring.datasource.password=${DB_PASSWORD:microbill_pass_2024}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:microbill_admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq_pass_2024}

# Server
server.port=${BILLING_SERVICE_PORT:8080}

# Auth Service
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8079}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8082}

# RabbitMQ Config
rabbitmq.exchange.invoice=invoice.exchange
rabbitmq.queue.invoice-created=invoice.created.queue
rabbitmq.routing-key.invoice-created=invoice.created

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
