openapi: 3.0.3
info:
  title: MicroBill Billing API
  description: Billing service with invoices, items, PDF reports and messaging
  version: 1.0.0
servers:
  - url: http://localhost:8083/api
    description: Local server

tags:
  - name: Invoices
    description: Invoice management

paths:
  /invoices:
    get:
      tags:
        - Invoices
      summary: Get all invoices
      operationId: getInvoices
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: customerId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Invoices retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePageResponse'
    post:
      tags:
        - Invoices
      summary: Create invoice
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'

  /invoices/{id}:
    get:
      tags:
        - Invoices
      summary: Get invoice by ID
      operationId: getInvoiceById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Invoice found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '404':
          description: Invoice not found
    put:
      tags:
        - Invoices
      summary: Update invoice
      operationId: updateInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '200':
          description: Invoice updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
    delete:
      tags:
        - Invoices
      summary: Delete invoice
      operationId: deleteInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Invoice deleted

  /invoices/{id}/generate-report:
    post:
      tags:
        - Invoices
      summary: Generate PDF report for invoice
      operationId: generateInvoiceReport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: PDF generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary

components:
  schemas:
    InvoiceRequest:
      type: object
      required:
        - customerId
        - providerId
        - items
      properties:
        customerId:
          type: integer
          format: int64
        providerId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItemRequest'

    InvoiceItemRequest:
      type: object
      required:
        - productId
        - quantity
        - unitPrice
        - taxRate
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        taxRate:
          type: number
          format: double

    InvoiceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        providerId:
          type: integer
          format: int64
        issueDate:
          type: string
          format: date-time
        subtotal:
          type: number
          format: double
        taxTotal:
          type: number
          format: double
        total:
          type: number
          format: double
        status:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItemResponse'

    InvoiceItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        taxRate:
          type: number
          format: double
        lineTotal:
          type: number
          format: double

    InvoicePageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
