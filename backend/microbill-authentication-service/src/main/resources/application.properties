# Application
spring.application.name=microbill-authentication-service

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT_AUTH:3306}/${DB_NAME_AUTH:microbill_auth}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=${AUTH_SERVICE_PORT:8081}

# JWT
jwt.secret=${JWT_SECRET:microbill-secret-key-change-in-production-2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
