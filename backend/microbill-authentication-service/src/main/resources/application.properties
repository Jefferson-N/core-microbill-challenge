# Application
spring.application.name=microbill-authentication-service

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://127.0.0.1:4200}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# JWT Configuration
jwt.secret=${JWT_SECRET:yMgG5oRTgVEdY5usxFodl762V7PRLxyTlVMkQTKBEhWKsGbWUjsxJaALCSwr3qKr}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Security Configuration
security.public-endpoints=${SECURITY_PUBLIC_ENDPOINTS:/api/auth/**,/swagger-ui/**,/v3/api-docs/**,/internal/**}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.core.microbill=${LOGGING_LEVEL_COM_CORE_MICROBILL:DEBUG}

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:microbill_billing}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:appuser123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=${AUTH_SERVICE_PORT:8081}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
