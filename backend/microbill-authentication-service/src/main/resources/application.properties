# Application
spring.application.name=microbill-authentication-service
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://127.0.0.1:4200,http://127.0.0.1:8080,http://localhost:4200,http://localhost:8080}

# JWT

jwt.secret=${JWT_SECRET:KxDScVfSptGqkaBpXjzepohpLitTHrTTtjBDuYDdesAEaEUUNx}
jwt.expiration=3600

logging.level.root=DEBUG

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:microbill_billing}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:appuser}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=${AUTH_SERVICE_PORT:8079}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
