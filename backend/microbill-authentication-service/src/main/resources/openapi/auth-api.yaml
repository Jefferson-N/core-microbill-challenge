openapi: 3.0.3
info:
  title: MicroBill Authentication API
  description: Authentication and authorization service with JWT
  version: 1.0.0
servers:
  - url: http://localhost:8081/api
    description: Auth Service
  - url: http://localhost:8082/api
    description: Management Service
  - url: http://localhost:8083/api
    description: Billing Service
  - url: http://localhost:8084/api
    description: AI Service

tags:
  - name: Auth
    description: Authentication operations
  - name: Users
    description: User management operations

paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Business logic error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      operationId: getUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/validate:
    post:
      tags:
        - Auth
      summary: Validate JWT token
      operationId: validateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenValidationRequest'
      responses:
        '200':
          description: Token validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Management Service Endpoints
  /customers:
    get:
      tags:
        - Customers
      summary: Get all customers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Customers retrieved successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
        - Customers
      summary: Create customer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Customer created
        '401':
          description: Unauthorized

  /providers:
    get:
      tags:
        - Providers
      summary: Get all providers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Providers retrieved successfully
        '401':
          description: Unauthorized
    post:
      tags:
        - Providers
      summary: Create provider
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Provider created
        '401':
          description: Unauthorized

  /products:
    get:
      tags:
        - Products
      summary: Get all products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Products retrieved successfully
        '401':
          description: Unauthorized
    post:
      tags:
        - Products
      summary: Create product
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Product created
        '401':
          description: Unauthorized

  # Billing Service Endpoints
  /invoices:
    get:
      tags:
        - Invoices
      summary: Get all invoices
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Invoices retrieved successfully
        '401':
          description: Unauthorized
    post:
      tags:
        - Invoices
      summary: Create invoice
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Invoice created
        '401':
          description: Unauthorized

  /invoices/{id}/generate-report:
    post:
      tags:
        - Invoices
      summary: Generate invoice PDF report
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: PDF generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '404':
          description: Invoice not found

  # AI Service Endpoints
  /ai/recommendations:
    post:
      tags:
        - AI
      summary: Get product recommendations
      security:
        - BearerAuth: []
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Recommendations retrieved successfully
        '401':
          description: Unauthorized

  /ai/anomaly-score:
    post:
      tags:
        - AI
      summary: Detect anomalies in invoice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyRequest'
      responses:
        '200':
          description: Anomaly detection completed
        '401':
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication
  
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        type:
          type: string
          default: Bearer
        username:
          type: string
        roles:
          type: array
          items:
            type: string

    RegisterRequest:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        enabled:
          type: boolean
        roles:
          type: array
          items:
            type: string

    UserPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
        error:
          type: string
          description: Error type
        status:
          type: integer
          description: HTTP status code
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
        path:
          type: string
          description: Request path

    TokenValidationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT token to validate

    TokenValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the token is valid
        username:
          type: string
          description: Username extracted from token

    CustomerRequest:
      type: object
      required:
        - name
        - docNumber
        - email
      properties:
        name:
          type: string
        docNumber:
          type: string
        email:
          type: string
          format: email
        address:
          type: string

    AnomalyRequest:
      type: object
      required:
        - customerId
        - total
        - items
      properties:
        customerId:
          type: integer
          format: int64
        total:
          type: number
          format: double
        items:
          type: array
          items:
            type: object
